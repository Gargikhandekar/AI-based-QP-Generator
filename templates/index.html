<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>AI Question Generator</h1>

    <form method="POST" action="/generate">
        <label for="input_text">Enter text to generate questions (optional):</label>
        <textarea id="input_text" name="input_text" rows="6" placeholder="Enter paragraph or text here to generate questions..."></textarea>

        <label for="subject">Or select subject:</label>
        <select id="subject" name="subject">
            {% for subject in subjects %}
            <option value="{{ subject }}">{{ subject }}</option>
            {% endfor %}
        </select>

        <label for="difficulty">Select difficulty:</label>
        <select id="difficulty" name="difficulty">
            {% for diff in difficulties %}
            <option value="{{ diff }}">{{ diff }}</option>
            {% endfor %}
        </select>

        <label for="num_questions">Number of questions:</label>
        <input type="number" id="num_questions" name="num_questions" min="1" max="20" value="5">

        <button type="submit">Generate Questions</button>
    </form>
</div>
</body>
</html>
