<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>AI Question Generator</h1>

    <form method="POST" action="/generate">
        <label for="input_text">Enter text to generate questions (optional):</label>
        <textarea id="input_text" name="input_text" rows="6" placeholder="Enter paragraph or text here to generate questions..."></textarea>

        <label for="prompt_subject">Subject / Topic:</label>
        <input type="text" id="prompt_subject" name="prompt_subject" placeholder="e.g., Software Engineering">

        <label for="difficulty">Select difficulty:</label>
        <select id="difficulty" name="difficulty">
            <option value="">Any</option>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>

        <label for="num_questions">Number of questions:</label>
        <input type="number" id="num_questions" name="num_questions" min="1" max="20" value="5">

        <!-- Marks allocation removed in AI-only mode -->

        <button type="submit">Generate Questions</button>

        <label style="margin-top:15px; display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="force_ai" name="force_ai" value="1">
            Force AI generation (ignore CSV; use subject/topic)
        </label>
    </form>
</div>
</body>
</html>
